[pytest]
testpaths = tests
addopts = -ra -m "not integration"
markers =
    integration: downloads real BGE models from Hugging Face (slow, ~2.5 GB). Run with: pytest -m integration
# Starlette announces a future move of its TestClient away from httpx. It is about
# the test client only (not our code); revisit when FastAPI/Starlette are upgraded.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
