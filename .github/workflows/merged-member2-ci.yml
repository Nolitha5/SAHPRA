# Checks for the "Merged Member2" app (dashboard + backend). Runs only when files in that folder change.
# No secrets or model downloads: unit tests use fake embedders and temporary databases.
name: Merged Member2 CI

on:
  push:
    paths:
      - "Merged Member2/**"
      - ".github/workflows/merged-member2-ci.yml"
  pull_request:
    paths:
      - "Merged Member2/**"
      - ".github/workflows/merged-member2-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Merged Member2/member2-rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Merged Member2/member2-rag/requirements.txt
            Merged Member2/member2-rag/requirements-dev.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check
      - name: Unit tests
        run: python -m pytest

  dashboard:
    name: Dashboard (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Merged Member2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Merged Member2/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
