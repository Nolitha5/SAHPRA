[pytest]
testpaths = tests
addopts = -ra -m "not integration"
markers =
    integration: downloads real BGE models from Hugging Face (slow, ~2.5 GB). Run with: pytest -m integration
# Starlette announces a future move of its TestClient away from httpx. It is about
# the test client only (not our code); revisit when FastAPI/Starlette are upgraded.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    # Ragas 0.4 announces that evaluate() will be replaced by @experiment and that metrics move
    # to ragas.metrics.collections, but in the pinned ragas==0.4.3 that module does not yet
    # contain the NonLLM context metrics. Port app/evaluation/ragas_eval.py when upgrading Ragas.
    ignore:aevaluate\(\) is deprecated:DeprecationWarning
    ignore:evaluate\(\) is deprecated:DeprecationWarning
    ignore:Importing NonLLM\w+ from 'ragas.metrics' is deprecated:DeprecationWarning
