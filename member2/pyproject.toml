[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sahpra-m2-rag"
version = "1.1.0"
description = "Member 2 regulatory knowledge base, Evidence/RERA retrieval and S.4 Control agent"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "SAHPRA QA-RAG Member 2"}]
dependencies = ["pydantic>=2.5,<3", "numpy>=1.26", "httpx>=0.27", "fastapi>=0.110", "pymupdf>=1.24", "requests>=2.31", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
vector = ["chromadb>=0.5,<2"]
models = ["sentence-transformers>=3.0"]
langchain = ["langchain-core>=0.3"]
experiment = ["scikit-learn>=1.4", "pandas>=2.0", "ragas>=0.2", "mlflow>=2.15"]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.30", "ruff>=0.6"]
all = ["chromadb>=0.5,<2", "sentence-transformers>=3.0", "scikit-learn>=1.4", "pandas>=2.0", "ragas>=0.2", "mlflow>=2.15", "pytest>=8", "uvicorn>=0.30"]

[project.scripts]
m2-rag = "m2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
